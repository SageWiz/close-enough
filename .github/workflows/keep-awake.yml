# Keeps the free Supabase database from pausing after a quiet week.
# Runs every 3 days, and you can also run it by hand from the Actions tab.
name: Keep database awake

on:
  schedule:
    - cron: '17 14 */3 * *'   # 14:17 UTC every third day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/keep-awake.js
